PLG_CONTENT_MAPAVIAJES="Content - Map of trips (article codes and comments)"
PLG_CONTENT_MAPAVIAJES_XML_DESC="Article codes: {mapaviajes stats} prints “51 albums · 16 countries”; {mapaviajes albums}, {mapaviajes countries} and {mapaviajes photos} print just the number; add album=ID to count one map. It also lets Akeeba Engage / Engage handle the comments of the trips (it does nothing of that if Engage is not installed)."
